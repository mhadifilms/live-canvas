name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s session-canvas -v
      - name: Check viewer helpers with Node's built-in test runner
        if: matrix.python-version == '3.12'
        run: node --test session-canvas/test_viewer.mjs board/src/*.test.mjs
      - name: Build bundled shared-board editor
        if: matrix.python-version == '3.12'
        run: |
          npm ci --prefix board --ignore-scripts
          npm run build --prefix board
          git diff --exit-code -- session-canvas/index.html session-canvas/board-assets
