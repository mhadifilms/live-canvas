t-size:11px;font-weight:400}.body-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.outcome .body-text{font-size:13px;line-height:1.4;letter-spacing:0}.empty{color:var(--muted);font-weight:400}.outcome .empty{font-size:13px}.more{margin-top:7px;border:0;border-bottom:1px solid var(--line);padding:2px 0;background:none;color:var(--accent);font-size:11px;cursor:pointer}.current{padding:0 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}.activity-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin-top:8px}.activity-meta svg{flex-shrink:0;width:12px;height:12px}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.lane{min-width:0}.lane:first-child{grid-column:1/-1}.lane ul{list-style:none;margin:0;padding:0}.lane li{position:relative;padding-left:14px;margin:5px 0;overflow-wrap:anywhere;white-space:pre-wrap}.lane li:before{position:absolute;left:1px;top:7px;content:"";width:5px;height:5px;border:1px solid var(--muted);border-radius:1px}.lane.decisions li:before{background:var(--accent);border-color:var(--accent);border-radius:50%}.lane.next li:before{border:0;border-top:1px solid var(--muted);border-right:1px solid var(--muted);transform:rotate(45deg);top:7px}.lane .empty{font-size:12px;margin:0}.count{color:var(--muted);font-size:11px;font-weight:400}.visual{margin:16px 0}.visual iframe{display:block;width:100%;height:240px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}.visual button{font-size:11px;cursor:pointer;border:0;background:none;padding:2px 0;color:var(--accent)}details.archive,details.activity-panel{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;min-height:28px}summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--muted);font-size:16px;font-weight:400}details[open]>summary:after{content:"−"}.arc <style>

none}.connection{gap:6px}.connection #connection-text{display:none}.outcome{border:0;background:none;padding:0;margin:0 0 10px}.outcome .section-label{display:none}.source{display:none}.activity-panel{margin-top:8px}.archive{margin:0}.notice{margin-bottom:8px}

<body><main>
<header><h1 id="title"></h1><div class="connection"><label class="theme-control" for="theme-select">Theme <select id="theme-select" aria-label="Theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><span id="connection"><span class="dot"></span><span id="connection-text">Connecting</span></span></div></header>
<div id="loading" class="placeholder">Opening this session’s canvas…</div>
<div id="canvas" hidden>
<div class="identity"><span class="rule"></span><span>This session</span><code id="thread"></code></div>
<div id="notice" class="notice" role="status" hidden></div>
<section class="outcome" id="outcome-card" aria-label="Summary"><h2 class="section-label" id="outcome-label">Latest outcome <span class="source" id="outcome-source"></span></h2><p class="body-text" id="outcome"></p><button class="more" id="outcome-more" hidden>Read full outcome</button></section>
<details class="activity-panel"><summary><span>Activity <span class="count" id="activity-count"></span></span></summary><section class="current"><h2 class="section-label"><span id="current-label">Current work</span><span class="source" id="current-source"></span></h2><p class="body-text" id="current"></p><button class="more" id="current-more" hidden>Read full update</button><div class="activity-meta"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg><span id="activity"></span></div></section></details>
<section class="visual" id="visual-section" hidden><h2 class="section-label"><span id="visual-title">Visual note</span><button id="visual-expand">Expand</button></h2><iframe id="visual" title="Contained visual note" sandbox="" referrerpolicy="no-referrer"></iframe></section>
<div class="lanes"><section class="lane decisions"><h2 class="section-label">Decisions <span class="count" id="decisions-count"></span></h2><div id="decisions"></div></section><section class="lane"><h2 class="section-label">Open questions <span class="count" id="open-count"></span></h2><div id="open"></div></section><section class="lane next"><h2 class="section-label">Next <span class="count" id="next-count"></span></h2><div id="next"></div></section></div>
<details class="archive"><summary><span>Assistant updates <span class="count" id="feed-count"></span></span></summary><div class="archive-list" id="feed"></div></details>
<details class="archive"><summary><span>Revision history <span class="count" id="history-count"></span></span></summary><div class="archive-list" id="history"></div></details>
<footer class="footer"><span id="freshness">Waiting for a first update</span><span>Local · Private</span></footer>
</div>
</main>
<script>
let adaptiveSignature=null,adaptiveBoundary=null;const revealed=new Set();const themeSelect=document.getElementById('theme-select');const savedTheme=localStorage.getItem('session-canvas-theme')||'auto';themeSelect.value=savedTheme;if(savedTheme!=='auto')document.documentElement.dataset.theme=savedTheme;themeSelect.onchange=()=>{const value=themeSelect.value;localStorage.setItem('session-canvas-theme',value);if(value==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=value};
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
function eligibleAutomatic(data,item){return item&&(!data.context_started_at||new Date(item.at)>=new Date(data.context_started_at))?item:null}
function visibleBlock(block){if(block.type==='text')return !!block.text.trim();if(block.type==='table')return block.columns.length>0&&block.rows.some(row=>row.some(cell=>cell.trim()));return block.items.some(item=>typeof item==='string'?item.trim():block.type==='reveal'?item.prompt.trim()&&item.answer.trim():block.type==='timeline'?item.label.trim():item.text.trim())}
function showMore(parent,items,make,key,label){const visible=items.slice(0,5),rest=items.slice(5);visible.forEach((item,i)=>parent.append(make(item,i)));if(rest.length){const detail=element('details',undefined,'reveal-card');detail.dataset.disclosureKey=key;detail.open=revealed.has(key);detail.append(element('summary',label.replace('%d',rest.length)));const body=element(parent.matches('ul,ol')?parent.tagName.toLowerCase():'div');if(parent.matches('ul,ol'))body.className=parent.className;if(parent.matches('ol'))body.start=6;rest.forEach((item,i)=>body.append(make(item,i+5)));detail.append(body);detail.addEventListener('toggle',()=>{if(detail.open)revealed.add(key);else revealed.delete(key)});if(parent.matches('ul,ol')){const wrap=element('li');wrap.append(detail);parent.append(wrap)}else parent.append(detail)}}
function renderBlock(block,sectionId,contextKey){
 const node=element('div',undefined,'block');node.dataset.blockId=block.id;
 if(block.type==='text'){const p=element('p',block.text);if(block.text.length>260){const key=JSON.stringify([contextKey,sectionId,block.id,'text']),preview=element('p',block.text.slice(0,160).trimEnd()+'…');const detail=element('details',undefined,'reveal-card');detail.dataset.disclosureKey=key;detail.open=revealed.has(key);detail.append(element('summary','Show full text'),p);detail.addEventListener('toggle',()=>{if(detail.open)revealed.add(key);else revealed.delete(key)});node.append(preview,detail)}else node.append(p)}
 if(block.type==='list'){const list=element(block.ordered?'ol':'ul');showMore(list,block.items.filter(item=>item.trim()),item=>element('li',item),JSON.stringify([contextKey,sectionId,block.id,'list']),'Show %d more');node.append(list)}
 if(block.type==='checklist'){const list=element('ul',undefined,'checklist');showMore(list,block.items.filter(item=>item.text.trim()),item=>{const li=element('li'),mark=element('span',item.checked?'✓':'','check-mark'+(item.checked?' done':''));mark.setAttribute('aria-label',item.checked?'Complete':'Pending');li.append(mark,element('span',item.text));return li},JSON.stringify([contextKey,sectionId,block.id,'checklist']),'Show %d more');node.append(list)}
 if(block.type==='table'){const scroll=element('div',undefined,'table-scroll');scroll.tabIndex=0;scroll.setAttribute('role','region');scroll.setAttribute('aria-label','Scrollable comparison table');const renderTable=rows=>{const table=element('table'),head=element('thead'),row=element('tr'),body=element('tbody');for(const name of block.columns){const th=element('th',name);th.scope='col';row.append(th)}head.append(row);for(const values of rows){const tr=element('tr');for(const value of values)tr.append(element('td',value));body.append(tr)}table.append(head,body);return table};scroll.append(renderTable(block.rows.slice(0,5)));if(block.rows.length>5){const key=JSON.stringify([contextKey,sectionId,block.id,'table']),detail=element('details',undefined,'reveal-card');detail.dataset.disclosureKey=key;detail.open=revealed.has(key);detail.append(element('summary','Show '+(block.rows.length-5)+' more rows'),renderTable(block.rows.slice(5)));detail.addEventListener('toggle',()=>{if(detail.open)revealed.add(key);else revealed.delete(key)});scroll.append(detail)}node.append(scroll)}
 if(block.type==='reveal'){showMore(node,block.items.filter(item=>item.prompt.trim()&&item.answer.trim()),item=>{const key=JSON.stringify([contextKey,sectionId,block.id,item.id,item.prompt]),detail=element('details',undefined,'reveal-card');detail.dataset.revealId=item.id;detail.dataset.disclosureKey=key;detail.open=revealed.has(key);detail.append(element('summary',item.prompt),element('p',item.answer,'reveal-answer'));detail.addEventListener('toggle',()=>{if(detail.open)revealed.add(key);else revealed.delete(key)});return detail},JSON.stringify([contextKey,sectionId,block.id,'reveal-more']),'Show %d more')}
 if(block.type==='timeline'){const list=element('ol',undefined,'timeline');showMore(list,block.items.filter(item=>item.label.trim()),item=>{const li=element('li');if(item.at)li.append(element('time',item.at));li.append(element('strong',item.label));if(item.detail)li.append(element('p',item.detail));return li},JSON.stringify([contextKey,sectionId,block.id,'timeline']),'Show %d more');node.append(list)}
 return node;
}
function renderAdaptive(data){
 const c=data.content,context=c.context,sections=c.sections||[];const boundary=JSON.stringify([context?.id||null,data.context_started_at]);if(adaptiveBoundary!==null&&adaptiveBoundary!==boundary)requestAnimationFrame(()=>window.scrollTo(0,0));adaptiveBoundary=boundary;let host=document.getElementById('adaptive');if(!host){host=element('div');host.id='adaptive';document.getElementById('outcome-card').after(host)}
 const signature=JSON.stringify([context,sections,data.context_started_at]);if(signature!==adaptiveSignature){for(const detail of host.querySelectorAll('[data-disclosure-key]')){if(detail.open)revealed.add(detail.dataset.disclosureKey);else revealed.delete(detail.dataset.disclosureKey)}adaptiveSignature=signature;host.replaceChildren();
 for(const section of sections){const blocks=section.blocks.filter(visibleBlock);if(!blocks.length)continue;const sectionNode=element('section',undefined,'adaptive-section');sectionNode.dataset.sectionId=section.id;if(section.title)sectionNode.append(element('h2',section.title));for(const block of blocks)sectionNode.append(renderBlock(block,section.id,JSON.stringify([context?.id||'legacy',data.context_started_at])));host.append(sectionNode)}}
 host.hidden=!host.childElementCount;for(const name of ['decisions','open','next'])document.getElementById(name).closest('.lane').hidden=!c[name].length;document.querySelector('.lanes').hidden=!['decisions','open','next'].some(name=>c[name].length);
}
const $=id=>document.getElementById(id);const activityPanel=document.querySelector('.activity-panel');document.querySelectorAll('details.archive').forEach(panel=>activityPanel.append(panel));let state=null,etag=null,failures=0,expanded=false,currentExpanded=false,lastVisual=null,outcomeText='',lastOutcome='',currentText='';
function relative(stamp){if(!stamp)return 'No activity received';const seconds=Math.max(0,(Date.now()-new Date(stamp).getTime())/1000);if(!Number.isFinite(seconds))return 'Time unavailable';if(seconds<15)return 'just now';if(seconds<60)return Math.floor(seconds)+'s ago';if(seconds<3600)return Math.floor(seconds/60)+'m ago';if(seconds<86400)return Math.floor(seconds/3600)+'h ago';return Math.floor(seconds/86400)+'d ago'}
function timeLabel(stamp){return new Date(stamp).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function text(id,value,fallback){const el=$(id);el.textContent=value||fallback;el.classList.toggle('empty',!value)}
function renderList(id,items,fallback){const holder=$(id);holder.replaceChildren();$(id+'-count').textContent=items.length||'';if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent=fallback;holder.append(p);return}const ul=document.createElement('ul');for(const item of items){const li=document.createElement('li');li.textContent=item;ul.append(li)}holder.append(ul)}
function renderOutcome(){text('outcome',expanded?outcomeText:outcomeText.length>700?outcomeText.slice(0,700).trimEnd()+'…':outcomeText,'The next result will appear here.');$('outcome-more').hidden=outcomeText.length<=700;$('outcome-more').textContent=expanded?'Show less':'Read full outcome'}
$('outcome-more').onclick=()=>{expanded=!expanded;renderOutcome()};
function renderCurrent(){text('current',currentExpanded?currentText:currentText.length>500?currentText.slice(0,500).trimEnd()+'…':currentText,'No current work has been recorded.');$('current-more').hidden=currentText.length<=500;$('current-more').textContent=currentExpanded?'Show less':'Read full update'}
$('current-more').onclick=()=>{currentExpanded=!currentExpanded;renderCurrent()};
$('visual-expand').onclick=()=>{const tall=$('visual').style.height==='560px';$('visual').style.height=tall?'320px':'560px';$('visual-expand').textContent=tall?'Expand':'Reduce'};
function entry(head,stamp,body){const node=document.createElement('article');node.className='entry';const meta=document.createElement('div');meta.className='entry-head';const label=document.createElement('span');label.textContent=head;const when=document.createElement('time');when.textContent=timeLabel(stamp);meta.append(label,when);node.append(meta);if(body){const p=document.createElement('p');p.className='body-text';p.textContent=body.length>500?body.slice(0,500)+'…':body;node.append(p);if(body.length>500){const detail=document.createElement('details'),summary=document.createElement('summary'),full=document.createElement('p');summary.textContent='Full update';full.className='body-text';full.textContent=body;detail.append(summary,full);node.append(detail)}}return node}
function render(data){state=data;renderAdaptive(data);$('loading').hidden=true;$('canvas').hidden=false;const c=data.content;const authored=!!(c.context||(c.sections||[]).some(section=>section.blocks?.some(visibleBlock)));document.title=c.title+' · Canvas';$('title').textContent=c.title;$('thread').textContent=data.thread.slice(0,8);$('thread').title=data.thread;const final=eligibleAutomatic(data,data.automatic.latest_final),commentary=eligibleAutomatic(data,data.automatic.latest_commentary);const finalNew=final&&(!c.outcome||new Date(final.at)>new Date(data.content_updated_at?.outcome||data.curated_at||0));outcomeText=authored?c.outcome:(finalNew?final.text:c.outcome);if(outcomeText!==lastOutcome){expanded=false;$('outcome-card').classList.remove('changed');void $('outcome-card').offsetWidth;$('outcome-card').classList.add('changed');lastOutcome=outcomeText}renderOutcome();$('outcome-card').hidden=authored?!c.outcome:!outcomeText;$('outcome-source').textContent=finalNew?'Assistant response':c.outcome?'Curated':'';
const commentNew=commentary&&(!c.current||new Date(commentary.at)>new Date(data.content_updated_at?.current||data.curated_at||0));const nextCurrent=commentNew?commentary.text:c.current;if(currentText!==nextCurrent)currentExpanded=false;currentText=nextCurrent;renderCurrent();document.querySelector('.current').hidden=!currentText;$('current-label').textContent=data.activity.phase==='idle'?'Last update':'Current work';$('current-source').textContent=commentNew?'Assistant update':c.current?'Curated':'';$('activity-count').textContent=data.feed.length||data.history.length?'· '+(data.feed.length+data.history.length):'';renderList('decisions',c.decisions,'No decisions recorded yet.');renderList('open',c.open,'No open questions recorded.');renderList('next',c.next,'Next steps will appear here.');
$('visual-section').hidden=!c.visual_html;$('visual-title').textContent=c.visual_title||'Visual note';if(c.visual_html!==lastVisual){lastVisual=c.visual_html;$('visual-title').textContent=c.visual_title||'Visual note';$('visual').srcdoc='<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:; font-src \'none\'; base-uri \'none\'; form-action \'none\'"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}body{font:14px system-ui;margin:16px;overflow-wrap:anywhere}svg,img{max-width:100%;height:auto}</style>'+c.visual_html}
